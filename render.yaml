services:
  - type: web
    name: flowdesk-api
    runtime: python
    plan: starter
    buildCommand: pip install -e .
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_VECTOR_STORE_ID
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_DATABASE_PATH
        value: /var/data/flowdesk.db
      - key: GENERATED_MEDIA_PATH
        value: /var/data/generated_media
      - key: UPLOADED_ATTACHMENTS_PATH
        value: /var/data/uploaded_attachments
      - key: TEMPORARY_UPLOADS_PATH
        value: /var/data/temporary_uploads
      - key: FRONTEND_ORIGIN
        sync: false
      - key: FRONTEND_PUBLIC_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
    disk:
      name: flowdesk-data
      mountPath: /var/data
      sizeGB: 1

